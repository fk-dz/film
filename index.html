<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FATYAK - أفلام أجنبية مترجمة</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23e50914'/%3E%3Cstop offset='100%25' stop-color='%23ff3d47'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M35 28 L35 72 L72 50 Z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
  :root{--primary:#e50914;--primary-hover:#b00710;--dark:#0a0a0f;--darker:#050508;--card:#14141c;--text:#fff;--muted:#9ca3af;--accent:#f5c518}
  html,body{background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  
  .loader{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
  .loader.hidden{opacity:0;pointer-events:none}
  .loader-spinner{width:60px;height:60px;border:4px solid rgba(229,9,20,.2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:900;font-size:26px}
  .logo-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--primary),#ff3d47);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(229,9,20,.5);position:relative;overflow:hidden}
  .logo-icon::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);animation:shine 3s infinite}
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .logo-icon svg{width:24px;height:24px;fill:#fff;z-index:2}
  .logo-text{background:linear-gradient(45deg,#fff,#e0e0e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
  
  header{position:fixed;top:0;left:0;right:0;z-index:100;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);transition:background .3s}
  header.scrolled{background:rgba(5,5,8,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .search-box{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:30px;padding:8px 15px;border:1px solid rgba(255,255,255,.1)}
  .search-box input{background:transparent;border:none;outline:none;color:#fff;width:180px;font-family:inherit;font-size:14px}
  .search-box input::placeholder{color:var(--muted)}
  .search-box svg{width:18px;height:18px;fill:var(--muted);margin-left:8px}
  
  .hero{height:70vh;position:relative;background-size:cover;background-position:center;display:flex;align-items:center;padding:0 5%;transition:background-image 1s;margin-top:70px}
  .hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,8,.95) 0%,rgba(5,5,8,.6) 60%,transparent 100%),linear-gradient(180deg,transparent 60%,var(--dark) 100%)}
  .hero-content{position:relative;z-index:2;max-width:600px}
  .hero h1{font-size:42px;font-weight:900;margin-bottom:10px;line-height:1.1}
  .hero .hero-en{font-size:18px;color:var(--muted);font-weight:400;font-style:italic;margin-bottom:15px;direction:ltr;text-align:right}
  .hero-meta{display:flex;gap:15px;margin-bottom:15px;color:var(--muted);font-size:14px;flex-wrap:wrap}
  .hero-meta span{display:flex;align-items:center;gap:5px}
  .hero p{font-size:15px;line-height:1.7;color:#ddd}
  
  .section{padding:40px 5%}
  .section-title{font-size:22px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:'';width:5px;height:24px;background:var(--primary);border-radius:3px}
  
  .categories{display:flex;gap:10px;flex-wrap:wrap;padding:0 5%;margin-top:-20px;position:relative;z-index:3}
  .cat-btn{padding:8px 18px;border-radius:30px;background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,.05);cursor:pointer;font-weight:600;font-size:13px;transition:all .3s;font-family:inherit}
  .cat-btn:hover,.cat-btn:active{border-color:var(--primary)}
  .cat-btn.active{background:var(--primary);border-color:var(--primary)}
  
  .movies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
  .movie-card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .3s;position:relative}
  .movie-card:hover,.movie-card:active{transform:translateY(-5px);box-shadow:0 15px 30px rgba(229,9,20,.2)}
  .movie-poster{width:100%;aspect-ratio:2/3;background-size:cover;background-position:center;background-color:#1a1a24;position:relative}
  .movie-poster::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.9))}
  .movie-rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);padding:3px 8px;border-radius:15px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;z-index:2}
  .movie-rating svg{width:10px;height:10px;fill:var(--accent)}
  .movie-quality{position:absolute;top:8px;left:8px;background:var(--primary);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;z-index:2}
  .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;z-index:3}
  .movie-card:hover .play-overlay,.movie-card:active .play-overlay{opacity:1}
  .play-btn-circle{width:45px;height:45px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(229,9,20,.6)}
  .play-btn-circle svg{width:18px;height:18px;fill:#fff;margin-right:2px}
  
  .movie-info{padding:10px}
  .movie-title-ar{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .movie-title-en{font-size:10px;font-weight:400;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;font-style:italic;opacity:.8}
  .movie-year{font-size:10px;color:var(--muted)}
  
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.98);z-index:1000;display:none;align-items:center;justify-content:center;padding:15px}
  .modal-overlay.active{display:flex}
  .modal{background:var(--card);border-radius:15px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;position:relative;animation:slideUp .4s ease;-webkit-overflow-scrolling:touch}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .modal-close{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.8);border:none;color:#fff;cursor:pointer;z-index:10;font-size:18px;display:flex;align-items:center;justify-content:center}
  .modal-close:active{background:var(--primary)}
  
  .modal-video{width:100%;aspect-ratio:16/9;background:#000;position:relative;border-radius:15px 15px 0 0;overflow:hidden}
  .modal-video iframe{width:100%;height:100%;border:none;display:block}
  
  .modal-body{padding:20px}
  .modal-body h2{font-size:22px;margin-bottom:5px;color:var(--text)}
  .modal-body .original-title{font-size:14px;color:var(--muted);font-weight:400;margin-bottom:15px;font-style:italic;direction:ltr;text-align:right}
  .modal-meta{display:flex;gap:15px;margin-bottom:15px;color:var(--muted);flex-wrap:wrap;font-size:13px}
  .modal-meta span{display:flex;align-items:center;gap:5px}
  .modal-body p{line-height:1.7;margin-bottom:15px;color:#ddd;font-size:14px}
  .modal-tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{padding:5px 12px;background:rgba(255,255,255,.08);border-radius:15px;font-size:12px}
  
  footer{background:var(--darker);padding:30px 5%;text-align:center;border-top:1px solid rgba(255,255,255,.05);margin-top:40px}
  .footer-logo{justify-content:center;margin-bottom:10px}
  .footer-logo .logo-text{font-size:20px}
  footer p{color:var(--muted);font-size:13px}
  .developer{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);font-size:14px;color:var(--text);display:inline-flex;align-items:center;gap:8px}
  .developer strong{background:linear-gradient(45deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;letter-spacing:1px}
  
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:var(--darker)}
  ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:5px}
  
  @media(max-width:768px){
    .search-box input{width:120px}
    .hero{height:60vh;margin-top:65px}
    .hero h1{font-size:28px}
    .hero .hero-en{font-size:14px}
    .hero p{font-size:13px}
    .movies-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
    .modal-body h2{font-size:18px}
    .modal-body .original-title{font-size:12px}
    .logo-text{font-size:20px}
    .logo-icon{width:36px;height:36px}
    .movie-title-ar{font-size:12px}
    .movie-title-en{font-size:9px}
  }
</style>
</head>

  <div class="logo">

<div class="categories">

</div>

<section class="section">

  <div class="movies-grid" id="moviesGrid"></div>
</section>

<div class="modal-overlay" id="modal">

    <button class="modal-close" onclick="closeModal()">✕</button>

    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="original-title" id="modalOriginalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <p id="modalDesc"></p>
      <div class="modal-tags" id="modalTags"></div>
    </div>
  </div>
</div>

<footer>
  <div class="logo footer-logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg></div>
    <span class="logo-text">FATYAK</span>
  </div>
  <p>أفضل موقع لمشاهدة الأفلام الأجنبية مترجمة بالعربية</p>
  <div class="developer">تطوير وبرمجة: <strong>FATYAK</strong> 🚀</div>
</footer>

let currentCategory = 'all';
let currentMovie = null;

// ===== Hero ديناميكي =====
function setupHero() {
  try {
    const featured = movies[Math.floor(Math.random() * Math.min(10, movies.length))];
    const hero = document.getElementById('hero');
    if (featured.poster) {
      hero.style.backgroundImage = 'url(' + featured.poster + ')';
    }
    document.getElementById('heroTitle').textContent = featured.titleAr;
    document.getElementById('heroTitleEn').textContent = featured.title;
  } catch(e) {
    console.log('Hero error:', e);
  }
}

// ===== عرض الأفلام =====
function renderMovies(list) {
  try {
    const grid = document.getElementById('moviesGrid');
    grid.innerHTML = '';
    
    if (!list || list.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">لا توجد نتائج</p>';
      return;
    }
    
    const fragment = document.createDocumentFragment();
    
    list.forEach(function(movie) {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.onclick = function() { playMovie(movie); };
      
      const poster = movie.poster || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"%3E%3Crect fill="%231a1a24" width="200" height="300"/%3E%3Ctext x="100" y="150" text-anchor="middle" fill="%23666" font-size="14"%3Eلا توجد صورة%3C/text%3E%3C/svg%3E';
      const rating = movie.rating ? movie.rating.toFixed(1) : 'N/A';
      const titleAr = movie.titleAr || 'بدون عنوان';
      const titleEn = movie.title || '';
      const year = movie.year || '';
      
      card.innerHTML = 
        '<div class="movie-poster" style="background-image:url(\'' + poster + '\')">' +
          '<div class="movie-rating"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>' + rating + '</div>' +
          '<div class="movie-quality">' + (movie.quality || 'HD') + '</div>' +
          '<div class="play-overlay"><div class="play-btn-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>' +
        '</div>' +
        '<div class="movie-info">' +
          '<div class="movie-title-ar">' + titleAr + '</div>' +
          '<div class="movie-title-en">' + titleEn + '</div>' +
          '<div class="movie-year">' + year + '</div>' +
        '</div>';
      
      fragment.appendChild(card);
    });
    
    grid.appendChild(fragment);
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('moviesGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">حدث خطأ في عرض الأفلام</p>';
  }
}

// ===== تصفية الفئات =====
function filterCategory(cat, btn) {
  try {
    currentCategory = cat;
    if (btn) {
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }
    const filtered = cat === 'all' ? movies : movies.filter(function(m) { return m.category === cat; });
    renderMovies(filtered);
  } catch(e) {
    console.error('Filter error:', e);
  }
}

// ===== البحث =====
function searchMovies() {
  try {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (q.length < 1) {
      filterCategory(currentCategory, document.querySelector('.cat-btn.active'));
      return;
    }
    const filtered = movies.filter(function(m) {
      return (m.titleAr && m.titleAr.toLowerCase().includes(q)) || 
             (m.title && m.title.toLowerCase().includes(q));
    });
    renderMovies(filtered);
  } catch(e) {
    console.error('Search error:', e);
  }
}

// ===== تشغيل الفيلم =====
function playMovie(movie) {
  try {
    currentMovie = movie;
    
    document.getElementById('modalTitle').textContent = movie.titleAr || 'بدون عنوان';
    document.getElementById('modalOriginalTitle').textContent = movie.title || '';
    document.getElementById('modalDesc').textContent = movie.desc || 'لا يوجد وصف متاح';
    
    document.getElementById('modalMeta').innerHTML = 
      '<span>⭐ ' + (movie.rating || 'N/A') + '</span>' +
      '<span>📅 ' + (movie.year || '') + '</span>' +
      '<span>⏱️ ' + (movie.duration || '') + '</span>';
    
    const categoryNames = {
      'action': 'أكشن', 'comedy': 'كوميديا', 'drama': 'دراما', 
      'horror': 'رعب', 'scifi': 'خيال علمي', 'thriller': 'إثارة'
    };
    
    document.getElementById('modalTags').innerHTML = 
      '<span class="tag">' + (categoryNames[movie.category] || 'عام') + '</span>' +
      '<span class="tag">مترجم</span>' +
      '<span class="tag">عربي</span>';
    
    const ytId = movie.youtubeId || 'dQw4w9WgXcQ';
    const embedUrl = 'https://www.youtube.com/embed/' + ytId + '?autoplay=1&rel=0&modestbranding=1&controls=1&hl=ar';
    
    document.getElementById('modalVideo').innerHTML = 
      '<iframe src="' + embedUrl + '" ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
      'allowfullscreen></iframe>';
    
    document.getElementById('modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  } catch(e) {
    console.error('Play error:', e);
    alert('حدث خطأ في تشغيل الفيلم');
  }
}

// ===== إغلاق المودال =====
function closeModal() {
  try {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('modalVideo').innerHTML = '';
    document.body.style.overflow = 'auto';
    currentMovie = null;
  } catch(e) {
    console.error('Close error:', e);
  }
}

// ===== أحداث =====
try {
  window.addEventListener('scroll', function() {
    document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
  });
  
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target.id === 'modal') closeModal();
  });
  
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
} catch(e) {
  console.error('Events error:', e);
}

// ===== التشغيل الأولي =====
try {
  setupHero();
  renderMovies(movies);
  setTimeout(function() {
    document.getElementById('loader').classList.add('hidden');
  }, 800);
} catch(e) {
  console.error('Init error:', e);
  document.getElementById('loader').classList.add('hidden');
}
</script>
